<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM EVENT</title>
</head>

<body>

    <h1>DOM EVENTS </h1>

    <!-- option 1 for dom event handler -->

    <button onclick="console.log(7)">CLICK ME</button>
    <input type="text">
    <button onclick="console.log(63)">Another Button</button>

    <br>

    <!-- option 2 for dom  event handaler -->

    <button onclick="makeYellow()">Make Yellow</button>
    <button onclick="makeRed()">Make Red</button>
    <br>

    <button id="btn-make-blue">MAKE BLUE</button>
    <script>
        const btnMakeBlue = document.getElementById('btn-make-blue');
        // console.log(btnMakeBlue);
        btnMakeBlue.onclick = function(){
            document.body.style.backgroundColor = 'blue';
        }
    </script>

    <script src="./Javascript/events.js"></script>

</body>

</html>
