<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM EVENT</title>
</head>

<body>

    <h1>DOM EVENTS </h1>

    <!-- option 1 for dom event handler -->

    <button onclick="console.log(7)">CLICK ME</button>
    <input type="text">
    <button onclick="console.log(63)">Another Button</button>

    <br>

    <!-- option 2 for dom  event handaler -->

    <button onclick="makeYellow()">Make Yellow</button>
    <button onclick="makeRed()">Make Red</button>
    <br>

    <button id="btn-make-blue">MAKE BLUE</button>

    <br>
    <button id="btn-make-green">MAKE GREEN</button>
    <br>

    <!-- Option 4 : addEventListener -->
    <button id="btn-make-pink">MAKE PINK</button>


    <script>
        // document.getElementById('btn-make-pink').addEventListener('event type', handler)
        // document.getElementById('btn-make-pink').addEventListener('click', function makePink() {})
        document.getElementById('btn-make-pink').addEventListener('click', function makePink() {
            document.body.style.backgroundColor = 'pink';
        })

    </script>

    <script src="./Javascript/events.js"></script>

</body>

</html>
